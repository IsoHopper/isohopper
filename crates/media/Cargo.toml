[package]
name = "isohopper-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
same-file = "1"
ed25519-dalek = "=3.0.0"
url = "=2.5.8"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Ioctl", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true
