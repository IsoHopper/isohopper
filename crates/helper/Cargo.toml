[package]
name = "isohopper-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
isohopper-core = { path = "../core" }
isohopper-inventory = { path = "../inventory" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
hmac = "0.12"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Vhd", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
isohopper-media = { path = "../media" }
cap-std = "=4.0.3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Storage_Vhd", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
