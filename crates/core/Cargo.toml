[package]
name = "isohopper-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
lzma-rust2 = { version = "=0.24.0", default-features = false, features = ["std", "xz"] }
getrandom = "0.3"
same-file = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
