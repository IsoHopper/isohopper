[package]
name = "isohopper-studio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/IsoHopper/isohopper"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
isohopper-cli = { path = "../../crates/cli" }
isohopper-config = { path = "../../crates/config" }
isohopper-core = { path = "../../crates/core" }
isohopper-media = { path = "../../crates/media" }
isohopper-inventory = { path = "../../crates/inventory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
getrandom = "=0.4.3"
same-file = "=1.0.6"
sha2 = "0.10"
isohopper-helper = { path = "../../crates/helper" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
