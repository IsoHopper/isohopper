[workspace]
resolver = "2"
members = ["crates/core", "crates/config", "crates/cli", "crates/helper", "crates/media", "crates/inventory", "boot/launcher"]
default-members = ["crates/core", "crates/config", "crates/cli", "crates/helper", "crates/media", "crates/inventory", "boot/launcher"]
exclude = ["studio/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.91"
repository = "https://github.com/IsoHopper/isohopper"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
