name: Experimental release

on:
  push:
    tags: ['v*-experimental.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New prerelease tag (for example v0.1.0-experimental.1)'
        required: true
        default: v0.1.0-experimental.1
        type: string

permissions:
  contents: read

concurrency:
  group: experimental-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'IsoHopper/isohopper' && (github.ref == 'refs/heads/main' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tag and packaging tests
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('studio/src-tauri/tauri.conf.json'))['version']
          assert re.fullmatch(r'v' + re.escape(version) + r'-experimental\.[1-9][0-9]*', os.environ['RELEASE_TAG']), 'Tag must match app version and experimental.N'
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release tag.' >&2
            exit 1
          fi
          python3 -m unittest discover -s scripts -p 'test*release*.py'

  build:
    needs: validate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.platform == 'macos-x64' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-x64
            os: windows-2022
            bundles: nsis
          - platform: macos-arm64
            os: macos-15
            bundles: dmg
          - platform: macos-x64
            os: macos-15-intel
            bundles: dmg
    defaults:
      run:
        shell: bash
    env:
      CI: true
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: ${{ matrix.platform == 'macos-x64' && 4 || 2 }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Test packaging with mock files before compiling
        run: python3 -m unittest discover -s scripts -p 'test*release*.py'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Cache downloaded Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'studio/src-tauri/Cargo.lock') }}
      - name: Install frontend dependencies
        run: npm --prefix studio/frontend ci --no-audit --no-fund
      - name: Test frontend
        if: runner.os == 'Linux'
        run: npm --prefix studio/frontend test
      - name: Test core with mocks and build CLI
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p isohopper-cli
          ./target/release/isohopper --version
          ./target/release/isohopper --help
          ./target/release/isohopper list --demo
      - name: Build and stage the Windows helper
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p isohopper-helper
          ./target/release/isohopper-helper.exe --version
          python3 scripts/stage-windows-helper.py --source target/release/isohopper-helper.exe
      - name: Test native backend
        run: |
          npm --prefix studio/frontend run build
          cargo test --manifest-path studio/src-tauri/Cargo.toml --locked
      - name: Build Studio installer
        working-directory: studio/src-tauri
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles "$BUNDLES" -- --locked
      - name: Collect packages and source manifest
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/package-release.py --platform "$RELEASE_PLATFORM" \
            --tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA" --output dist/release
      - name: Upload release candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify_packages:
    # Public releases require real USB preparation and OS boot integration tests.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify complete release and write checksums
        run: python3 scripts/verify-release.py --directory dist/release --tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA"
