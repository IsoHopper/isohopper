name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-packages:
    name: Windows package mocks
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release packaging with mock files
        shell: bash
        run: |
          python3 --version
          if python3 -m unittest discover -s scripts -p 'test*release*.py' > packaging-tests.log 2>&1; then
            cat packaging-tests.log
          else
            cat packaging-tests.log
            python - <<'PY'
          from pathlib import Path
          text = Path('packaging-tests.log').read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows packaging tests::' + text)
          PY
            exit 1
          fi

  check:
    name: Rust and Studio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies and workspace build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Run checks and Chromium integration tests
        run: ./scripts/check.sh --install-browser

      - name: Check read-only Linux inventory
        run: cargo test --locked -p isohopper-inventory --test native_smoke native_linux_inventory_is_read_only_and_fail_closed -- --ignored --nocapture

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromium-failure-traces
          path: studio/frontend/test-results
          if-no-files-found: ignore
          retention-days: 5
