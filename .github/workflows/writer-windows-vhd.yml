name: Windows storage integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/writer-windows-vhd.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/helper/**
      - crates/core/**
      - crates/media/**
      - crates/config/**
      - crates/inventory/**
      - studio/src-tauri/src/source_catalog.rs
      - studio/src-tauri/src/main.rs
      - studio/src-tauri/src/preparation.rs
      - studio/src-tauri/src/preparation/**
      - studio/src-tauri/src/elevation.rs
      - studio/src-tauri/src/elevation/**
      - tests/source-catalog/**

permissions:
  contents: read

concurrency:
  group: windows-vhd-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vhd-writer:
    name: Source handles, file copies and disposable VHDX
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Cache native storage compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-storage-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            native-storage-windows-

      - name: Observe disk records, pagefiles, BitLocker and storage pools without changes
        shell: bash
        run: |
          failed=0
          for probe in \
            windows_discovery:native_windows_typed_evidence_is_read_only \
            windows_pagefiles:native_windows_pagefiles_observes_only_active_runtime_names \
            windows_encryption:native_windows_encryption_observes_or_reports_missing_provider \
            windows_pools:windows_storage_pool_observation_smoke; do
            target="${probe%%:*}"
            test_name="${probe#*:}"
            if cargo +1.98.0 test --locked -p isohopper-inventory --test "$target" "$test_name" -- --ignored --exact --nocapture --test-threads=1 > "$target.log" 2>&1; then
              cat "$target.log"
            else
              failed=1
              python - "$target.log" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows preflight observation failed::' + text)
          PY
            fi
          done
          exit "$failed"

      - name: Check PowerShell projections with controlled CIM responses
        shell: bash
        run: |
          failed=0
          for test_name in \
            windows_encryption::tests::windows_projects_bitlocker_methods_without_inventing_success \
            windows::projection_tests::windows_projects_typed_disk_evidence_from_controlled_cim \
            windows_labels::tests::windows_projects_volume_labels_from_controlled_records; do
            if cargo +1.98.0 test --locked -p isohopper-inventory --lib "$test_name" -- --exact --nocapture > projection.log 2>&1; then
              cat projection.log
            else
              failed=1
              python - <<'PYERROR'
          from pathlib import Path
          text = Path('projection.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows controlled projection failed::' + text)
          PYERROR
            fi
          done
          exit "$failed"

      - name: Inspect protected storage and retained disk identity without writes
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --lib --test windows_protected --test windows_source_transfer --test windows_installation --test probe_command > helper-unit.log 2>&1 &&
             cargo +1.98.0 test --locked -p isohopper-helper --lib windows_peer::native::tests::native_linked_token_relationship_is_observed_without_elevation -- --exact --ignored --nocapture >> helper-unit.log 2>&1; then
            cat helper-unit.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('helper-unit.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows helper checks failed::' + text)
          PY
            exit 1
          fi
          failed=0
          for probe in \
            windows_protected:windows_protected_system_and_executable_mappings_are_read_only \
            windows_peer:windows_peer_observes_current_process_and_owned_child \
            windows_source_transfer:windows_source_transfer_retains_readonly_file_from_owned_child \
            windows_pipe:windows_pipe_checks_peers_deadlines_and_frames \
            windows_pipe:windows_pipe_transfers_source_from_retained_peer \
            windows_identity:windows_vhd_identity_queries_agree_or_report_unsupported \
            windows_target:windows_vhd_provider_path_binds_to_retained_target \
            windows_pagefile_probe:windows_active_pagefile_zero_access_metadata_probe; do
            target="${probe%%:*}"
            test_name="${probe#*:}"
            log_file="${target}-${test_name}.log"
            if cargo +1.98.0 test --locked -p isohopper-helper --test "$target" "$test_name" -- --ignored --exact --nocapture --test-threads=1 > "$log_file" 2>&1; then
              cat "$log_file"
            else
              failed=1
              python - "$log_file" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows retained storage inspection failed::' + text)
          PY
            fi
          done
          exit "$failed"

      - name: Check actual filesystem copies and readback on Windows
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-media > media-tests.log 2>&1; then
            cat media-tests.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('media-tests.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows media integration failed::' + text)
          PY
            exit 1
          fi

      - name: Verify native source retention without a WebView build
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-source-catalog-tests --test source_catalog > source-tests.log 2>&1; then
            cat source-tests.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('source-tests.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows native source retention failed::' + text)
          PY
            exit 1
          fi

      - name: Check private staging ownership without token identity changes
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --lib windows_stage::native::tests::native_owned_stage_disk_has_private_lifetime_without_token_changes -- --ignored --exact --nocapture --test-threads=1 > owned-stage-test.log 2>&1; then
            cat owned-stage-test.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('owned-stage-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows private staging ownership failed::' + text)
          PY
            exit 1
          fi

      - name: Fetch the exact external engine fixture
        shell: python
        run: |
          import hashlib, os, pathlib, tempfile, urllib.request
          root = pathlib.Path(tempfile.mkdtemp(prefix='isohopper-engine-', dir=os.environ['RUNNER_TEMP']))
          request = urllib.request.Request(
              'https://github.com/ventoy/Ventoy/releases/download/v1.1.18/ventoy-1.1.18-linux.tar.gz',
              headers={'User-Agent': 'IsoHopper-native-validation'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(20_320_549)
          if len(data) != 20_320_548 or hashlib.sha256(data).hexdigest() != 'd86ff9de63d94c8b8f1f6b14d23c55af4b88e8207bf2893890892a6a97b1ad54':
              raise SystemExit('External engine fixture size or SHA-256 mismatch')
          archive = root / 'engine.tar.gz'
          archive.write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ISOHOPPER_ENGINE_ARCHIVE={archive}\n')

      - name: Build and seal a private engine image using the production staging path
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --lib windows_stage::native::build::tests::native_stage_builds_persists_and_seals_pinned_engine -- --ignored --exact --nocapture --test-threads=1 > sealed-stage-test.log 2>&1; then
            cat sealed-stage-test.log
            python - <<'PY'
          from pathlib import Path
          text = Path('sealed-stage-test.log').read_text(errors='replace')
          evidence = [
              'OWNED_COORDINATOR_OK stage_host_bound=true confirmation=true cm_write_handoff=true persisted_raw_sha256=true nested_files=true physical_target=false',
              'OWNED_STAGE_SEALED_OK nested_files=4 persisted=true raw_sha256=true engine_regions=true physical_write=false',
              'OWNED_EMPTY_STAGE_OK sources=0 exfat=true persisted_raw_sha256=true physical_write=false',
          ]
          if not all(line in text for line in evidence):
              raise SystemExit('Expected production staging evidence is missing')
          print('::notice title=Windows production staging evidence::' + '%0A'.join(evidence))
          PY
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('sealed-stage-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows production image staging failed::' + text)
          PY
            exit 1
          fi

      - name: Check writable and read-only attachments of an owned VHDX
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --test windows_readiness windows_vhd_readiness_refuses_read_only_attachment -- --ignored --exact --nocapture --test-threads=1 > readiness-test.log 2>&1; then
            cat readiness-test.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('readiness-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows disk readiness failed::' + text)
          PY
            exit 1
          fi

      - name: Write and verify only a newly created temporary VHDX
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --test windows_vhd windows_vhd_writer_persists_verified_gpt -- --ignored --exact --nocapture > vhd-test.log 2>&1; then
            cat vhd-test.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('vhd-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows VHD writer integration failed::' + text)
          PY
            exit 1
          fi

      - name: Exercise filesystem locks on a new temporary VHDX
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --test windows_volume_lock windows_vhd_lock_refuses_open_file_and_releases_locks -- --ignored --exact --nocapture --test-threads=1 > volume-lock-test.log 2>&1; then
            cat volume-lock-test.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('volume-lock-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows VHD volume locking failed::' + text)
          PY
            exit 1
          fi

      - name: Reject sources backed by the selected disk or virtual parents
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --test windows_sources windows_sources_reject_target_extents_and_virtual_dependencies -- --ignored --exact --nocapture --test-threads=1 > source-volume-test.log 2>&1; then
            cat source-volume-test.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('source-volume-test.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows source volume binding failed::' + text)
          PY
            exit 1
          fi

      - name: Format and populate only a new disposable exFAT volume
        shell: bash
        run: |
          if cargo +1.98.0 test --locked -p isohopper-helper --test windows_exfat_stage windows_exfat_staging_preserves_nested_files_after_reattachment -- --ignored --exact --nocapture --test-threads=1 > exfat-stage.log 2>&1; then
            cat exfat-stage.log
          else
            python - <<'PY'
          from pathlib import Path
          text = Path('exfat-stage.log').read_text(errors='replace')[-12000:]
          print(text)
          text = text.encode('utf-8')[-3500:].decode('utf-8', errors='replace')
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows exFAT staging failed::' + text)
          PY
            exit 1
          fi

      - name: Record bounded read-only observations
        if: always()
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          patterns = {
              'helper-unit.log': r'LINKED_TOKEN status=(?:observed same_user=(?:true|false) same_logon=(?:true|false) same_session=(?:true|false) same_authentication=(?:true|false) current_full=(?:true|false) current_limited=(?:true|false) linked_full=(?:true|false) linked_limited=(?:true|false)|unsupported reason=(?:no_split_token|linked_query_unavailable win32=\d+))',
              'windows_discovery.log': r'OBSERVED Windows typed evidence: disks=\d+, partitions=\d+, issues=\d+, incomplete_components=\d+; no target safety conclusion',
              'windows_pagefiles.log': r'active_pagefiles=\d+',
              'windows_encryption.log': r'BitLocker provider (?:observed \d+ volumes; no write authorization|unavailable: (?:MissingNamespace|MissingClass); encryption state unknown)',
              'windows_pools.log': r'Observed \d+ physical disks; \d+ have concrete pool associations',
              'windows_peer-windows_peer_observes_current_process_and_owned_child.log': r'Windows peer observation passed: current=1 child=1 exited_child_rejected=1; no UAC or device access',
              'windows_pipe-windows_pipe_checks_peers_deadlines_and_frames.log': r'Windows pipe transport passed: roundtrip=1 cross_process=1 immediate_io=1 clean_eof=1 immediate_eof=1 partial_payload_eof=1 first_instance=1 wrong_peer=1 connect_timeout=1 connect_cancel=1 read_timeout=1 read_cancel=1 write_timeout=1 partial_header_timeout=1; no UAC or device access',
              'windows_source_transfer-windows_source_transfer_retains_readonly_file_from_owned_child.log': r'Windows source transfer passed: owned child, synchronous independent cursor, readonly sharing, invalid/non-file/closed/dead peer refusals; no UAC or devices',
              'windows_pipe-windows_pipe_transfers_source_from_retained_peer.log': r'Windows pipe source transfer passed: framed_handle=1 retained_child=1 sha256=1 readonly=1 wrong_handle=1 closed_handle=1 cancellation=1 deadline=1 poisoned=1; no UAC or devices',
              'windows_target-windows_vhd_provider_path_binds_to_retained_target.log': r'(?:Owned VHD interface selection: match=(?:exact|ascii_case_only)|Owned blank VHD provider path, retained native identity and empty partition topology agree across a fresh collection; no physical write or safety approval|UNSUPPORTED: owned VHD (?:identity is random \(flags \d+\)|has no native device GUID|driver lacks the device identity query); provider binding was refused, not passed)',
              'windows_identity-windows_vhd_identity_queries_agree_or_report_unsupported.log': r'Owned (?:read-only VHD identity agrees across retained handles; no physical device tested|VHD reports a random GUID \(flags \d+\); identity binding remains unsupported, not accepted|VHD has no device GUID; identity binding remains unsupported, not accepted|VHD driver does not implement the identity query \(Win32 Some\(\d+\)\); binding remains unsupported)',
              'windows_protected-windows_protected_system_and_executable_mappings_are_read_only.log': r'(?:Protected storage observations: successful_mappings=\d+, actual_volume_overlap_refusals=\d+, unsupported_executable_roles=\d+|UNSUPPORTED executable role=(?:Helper|Caller): external-backing query returned Win32 1; mapping remains blocked)',
              'volume-lock-test.log': r'(?:Owned formatted VHD provider binding agrees for 2 GPT partitions across a fresh collection; no physical device tested|VHD BitLocker observation: provider=(?:Reported\((?:Available|MissingNamespace|MissingClass)\)|QueryFailed\((?:UnsupportedPlatform|InvalidResponse|CommandFailed)\)), target_partitions=\d+, returned_volume_records=\d+)',
              'windows_pagefile_probe-windows_active_pagefile_zero_access_metadata_probe.log': r'(?:UNSUPPORTED: no active pagefiles observed; zero handle mappings verified|UNSUPPORTED: stage=open active pagefile, Win32=\d+, count=\d+|OBSERVED: \d+ active pagefile metadata handles, GUIDs and extents remained consistent; no production exclusion or backing-ancestry claim)',
              'exfat-stage.log': r'Owned VHD exFAT staging: 3 nested files copied and SHA-256 verified after read-only reattachment; GPT and both FAT boot slots preserved; no physical disk or OS boot tested',
          }
          messages = []
          for filename, pattern in patterns.items():
              path = Path(filename)
              if path.exists():
                  for message in re.findall(pattern, path.read_text(errors='replace')):
                      messages.append(message)
          if messages:
              print('::notice title=Windows observations::' + '%0A'.join(messages))
          path = Path('windows_protected-windows_protected_system_and_executable_mappings_are_read_only.log')
          seen = set()
          for raw in re.findall(r'^PROTECTED_BACKING_DIAGNOSTIC (\{[^\r\n]{1,2048}\})$', path.read_text(errors='replace') if path.exists() else '', re.M):
              try:
                  record = json.loads(raw)
              except (ValueError, RecursionError):
                  continue
              if not isinstance(record, dict) or record.get('event') != 'protected_external_backing':
                  continue
              role = record.get('role')
              if role not in ('helper', 'caller') or role in seen:
                  continue
              seen.add(role)
              safe = {'role': role}
              for component in ('retained_handle', 'filesystem', 'file', 'wof_wim', 'wof_file'):
                  item = record.get(component)
                  if not isinstance(item, dict):
                      continue
                  result = {}
                  if item.get('status') in ('ok', 'error', 'invalid', 'not_queried', 'unsupported'):
                      result['status'] = item['status']
                  for key in ('flags', 'attributes', 'hresult', 'version', 'win32_error', 'maximum_component_length'):
                      value = item.get(key)
                      if type(value) is int and 0 <= value <= 0xffffffff:
                          result[key] = value
                  if component == 'filesystem' and item.get('name') in ('NTFS', 'ReFS', 'FAT', 'FAT32', 'exFAT', 'UDF', 'CDFS', 'CSVFS', 'other'):
                      result['name'] = item['name']
                  safe[component] = result
              reopened = record.get('same_object_reopen')
              if isinstance(reopened, dict):
                  result = {}
                  if reopened.get('status') in ('observed', 'changed', 'error', 'not_queried'):
                      result['status'] = reopened['status']
                  if reopened.get('stage') in ('initial_metadata', 'reopen', 'before_query', 'after_query'):
                      result['stage'] = reopened['stage']
                  for key in ('identity_matches', 'sentinels_match', 'mapping_remains_blocked'):
                      if type(reopened.get(key)) is bool:
                          result[key] = reopened[key]
                  for key in ('win32_error',):
                      value = reopened.get(key)
                      if type(value) is int and 0 <= value <= 0xffffffff:
                          result[key] = value
                  for handle in ('original', 'reopened'):
                      query = reopened.get(handle)
                      if not isinstance(query, dict):
                          continue
                      observation = {}
                      if query.get('status') in ('success', 'error', 'invalid'):
                          observation['status'] = query['status']
                      for key in ('win32_error', 'returned_bytes', 'version', 'provider'):
                          value = query.get(key)
                          if type(value) is int and 0 <= value <= 0xffffffff:
                              observation[key] = value
                      result[handle] = observation
                  safe['same_object_reopen'] = result
              print('::notice title=Windows backing diagnostic::' + json.dumps(safe, separators=(',', ':')))
